<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CorteFácil — entrar</title>
  <link rel="icon" href="icone.png">
  <link rel="stylesheet" href="estilo.css">
</head>
<body class="pagina-entrar">
  <form class="caixa-entrar" id="form">
    <img src="icone.png" alt="" width="64" height="64">
    <h1>CorteFácil</h1>
    <p class="dica">Digite a senha de acesso do CorteFácil.</p>
    <input id="senha" autocomplete="one-time-code" maxlength="40"
      placeholder="senha" autofocus>
    <button class="btn-primario" type="submit">Entrar</button>
    <p class="erro-texto" id="erro"></p>
  </form>
  <script>
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const r = await fetch("/api/entrar", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ senha: document.getElementById("senha").value }),
      });
      if (r.ok) location.href = "/";
      else document.getElementById("erro").textContent =
        (await r.json().catch(() => ({}))).detail || "Não foi possível entrar.";
    });
  </script>
</body>
</html>
